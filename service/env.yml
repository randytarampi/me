dev: &devConfig
  baseDomainName: ${self:provider.stage}.randytarampi.ca
  domainName: ${self:service}.${self:custom.baseDomainName}
  # NOTE-RT: ISSUED 2026-08-29, DNS-validated against zone `Z1FDZJSPGC7GU7`. Replaces the
  # `ddc5763c-…` ARN, which never resolved to a real certificate in this account.
  acmArn: arn:aws:acm:us-east-1:${self:custom.awsAccountId}:certificate/b7723060-01e4-4697-a94f-f8f3f761509a
  acmName: "*.dev.randytarampi.ca"
  kmsKeyArn: arn:aws:kms:us-east-1:${self:custom.awsAccountId}:key/a83b4a56-95a6-4b38-8981-c32c67e3e8f3
  alarmTopic: arn:aws:sns:us-east-1:${self:custom.awsAccountId}:CloudWatchNotifications
  environment: &environment
    CAMPAIGN_SOURCE: ${file(package.json):name}
    CAMPAIGN_CONTENT: ${file(package.json):version}
    ME_PERSON_NAME: ${file(src/serverless/util/loadConfig.cjs):me.person.name}
    ME_PERSON_JOB_TITLE: ${file(src/serverless/util/loadConfig.cjs):me.person.jobTitle}
    ME_PERSON_IMAGE: ${file(src/serverless/util/loadConfig.cjs):me.person.image}
    ME_PERSON_DESCRIPTION: ${file(src/serverless/util/loadConfig.cjs):me.person.description}
    ME_PERSON_EMAIL: ${file(src/serverless/util/loadConfig.cjs):me.person.email}
    # NOTE-RT: defined in `serverless.yml`'s `custom:` block, not here, and referenced from both
    # sides so the Lambda environment variable and the `AWS::DynamoDB::Table` resource cannot
    # disagree. The reason they had to move is written out there.
    SERVICE_POSTS_DYNAMODB_TABLE: ${self:custom.postsTableName}
    SERVICE_AUTH_INFO_DYNAMODB_TABLE: ${self:custom.authInfoTableName}
    FLICKR_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):me.profiles.Flickr.username}
    GITHUB_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):me.profiles.GitHub.username}
    UNSPLASH_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):me.profiles.Unsplash.username}
    TUMBLR_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):me.profiles.Tumblr.username}
    # NOTE-RT: `config/me/profiles.cjs` doesn't carry these identifiers yet, and an unresolvable
    # `${file(...)}` reference aborts the whole deploy. Each of these sources gates itself on both
    # its credential and its identifier (see `src/lib/sources/*/index.js`), so an empty value simply
    # leaves that source switched off. Add the identifier to `config/me/profiles.cjs` to enable one.
    WORDPRESS_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):me.profiles.WordPress.username, ''}
    YOUTUBE_CHANNEL_ID: ${file(src/serverless/util/loadConfig.cjs):me.profiles.YouTube.channelId, ''}
    VIMEO_USER_ID: ${file(src/serverless/util/loadConfig.cjs):me.profiles.Vimeo.userId, ''}
    STACKOVERFLOW_USER_ID: ${file(src/serverless/util/loadConfig.cjs):me.profiles.StackOverflow.userId, ''}
    SOUNDCLOUD_USER_ID: ${file(src/serverless/util/loadConfig.cjs):me.profiles.SoundCloud.userId, ''}
    SERVICE_POSTS_S3_BUCKET_NAME: randytarampi-${self:service}-${self:provider.stage}-posts
    FEED_URL: ${file(src/serverless/util/loadConfig.cjs):posts.feedUrl}
    BLOG_URL: ${file(src/serverless/util/loadConfig.cjs):www.publishUrl}${file(src/serverless/util/loadConfig.cjs):www.postsUrl}
    PHOTOS_URL: ${file(src/serverless/util/loadConfig.cjs):www.publishUrl}${file(src/serverless/util/loadConfig.cjs):www.photosUrl}
    WORDS_URL: ${file(src/serverless/util/loadConfig.cjs):www.publishUrl}${file(src/serverless/util/loadConfig.cjs):www.wordsUrl}
    WWW_URL: ${file(src/serverless/util/loadConfig.cjs):www.publishUrl}
    SERVERLESS_STAGE: ${self:provider.stage}
    SERVERLESS_SERVICE: ${self:service}
    LOGGER_ENABLED: ${file(src/serverless/util/loadConfig.cjs):logger.enabled}
    LOGGER_LEVEL: ${file(src/serverless/util/loadConfig.cjs):logger.level}
    LOGGER_SRC_ENABLED: ${file(src/serverless/util/loadConfig.cjs):logger.src}
    LOGGER_STREAM_HUMAN_ENABLED: ${file(src/serverless/util/loadConfig.cjs):logger.streams.human}
    LOGGER_STREAM_STDOUT_ENABLED: ${file(src/serverless/util/loadConfig.cjs):logger.streams.stdout}
    LOGGER_STREAM_SENTRY_ENABLED: ${file(src/serverless/util/loadConfig.cjs):logger.streams.sentry}
    # NOTE-RT: the credentials, resolved from SSM Parameter Store by whoever runs the deploy rather
    # than by the function at run time. Serverless v4 decrypts `SecureString` parameters
    # automatically, so the v3-era `~true` suffix is gone; use `${ssm(raw):name}` for anything whose
    # value is JSON-shaped, or it gets silently parsed.
    #
    # All thirteen carry a `, ''` default now. They didn't always: the original design deliberately
    # left it off, on the theory that failing the *deploy* loudly beats a function that starts up
    # carrying a credential which merely looks present. In practice that meant an unpopulated
    # parameter for any one source — `soundcloud-access-token`, say — aborted the *entire* template,
    # blocking every function, not just the one that needed it. Decided 2026-08-29: these thirteen
    # are optional. Each source already gates on its credential being present before it does
    # anything (see `src/lib/sources/*/index.js`'s `isEnabled`) — the same pattern
    # `WORDPRESS_USER_NAME` above already uses for an absent profile identifier — so a missing
    # parameter now leaves that one source switched off instead of blocking the deploy outright.
    # `infrastructure/src/aws/secrets.ts` already skips (rather than defaults) any parameter with no
    # configured value; this is the CLI-side half of that same agreement.
    #
    # The names are flat (`flickr-api-key`, not `/${self:provider.stage}/flickr-api-key`) because
    # the stages are separated by region, not by namespace. They are declared in
    # `infrastructure/src/aws/secretNames.ts` and created by `infrastructure/src/aws/secrets.ts`.
    #
    # The trade-off, accepted knowingly: `${ssm:…}` bakes the resolved value into the CloudFormation
    # template, which lives in the Serverless deployment bucket and is readable in the Lambda
    # console. That bucket must block public access and be encrypted, and no workflow may run
    # `sls deploy --verbose`, which would print the rendered template into a CI log.
    FLICKR_API_KEY: ${ssm:flickr-api-key, ''}
    FLICKR_API_SECRET: ${ssm:flickr-api-secret, ''}
    UNSPLASH_API_KEY: ${ssm:unsplash-api-key, ''}
    UNSPLASH_API_SECRET: ${ssm:unsplash-api-secret, ''}
    TUMBLR_API_KEY: ${ssm:tumblr-api-key, ''}
    TUMBLR_API_SECRET: ${ssm:tumblr-api-secret, ''}
    GITHUB_API_KEY: ${ssm:github-api-key, ''}
    GITHUB_API_SECRET: ${ssm:github-api-secret, ''}
    YOUTUBE_API_KEY: ${ssm:youtube-api-key, ''}
    VIMEO_ACCESS_TOKEN: ${ssm:vimeo-access-token, ''}
    STACKOVERFLOW_API_KEY: ${ssm:stackoverflow-api-key, ''}
    SOUNDCLOUD_ACCESS_TOKEN: ${ssm:soundcloud-access-token, ''}
    SENTRY_DSN: ${ssm:sentry-dsn, ''}
  functions: &functions
    cachePosts: &cachePosts
      events:
        - schedule:
            rate: cron(1 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - flickr
        - schedule:
            rate: cron(5 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - unsplash
        - schedule:
            rate: cron(8 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - s3
        - schedule:
            rate: cron(9 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - tumblr
        - schedule:
            rate: cron(10 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - github
        - schedule:
            rate: cron(15 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - wordpress
        - schedule:
            rate: cron(20 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - youtube
        - schedule:
            rate: cron(25 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - vimeo
        - schedule:
            rate: cron(30 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - stackoverflow
        - schedule:
            rate: cron(35 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - soundcloud
    getPosts:
      events:
        - http:
            path: posts
            method: get
            cors: &corsConfiguration
              origin: "*"
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - X-Amz-User-Agent
                - ME-API-VERSION # NOTE-RT: It'd be really nice to just read this from a JS file, but then we'd need to babel everything before building the configuration, which is gross.
    getPostsRss:
      environment:
        CAMPAIGN_MEDIUM: rss
      events:
        - http:
            path: posts/feed.rss
            method: get
            cors: *corsConfiguration
prd:
  <<: *devConfig
  environment:
    <<: *environment
  baseDomainName: randytarampi.ca
  domainName: ${self:service}.${self:custom.baseDomainName}
  acmArn: arn:aws:acm:us-east-1:${self:custom.awsAccountId}:certificate/b363d5a1-7db1-4504-94a1-1dbe9273ae62
  acmName: "*.randytarampi.ca"
  kmsKeyArn: arn:aws:kms:ca-central-1:${self:custom.awsAccountId}:key/680708d1-fd35-4b54-af45-7adaba70f451
  alarmTopic: arn:aws:sns:ca-central-1:${self:custom.awsAccountId}:CloudWatchNotifications

local:
  <<: *devConfig
  environment:
    <<: *environment
    # NOTE-RT: no `SERVICE_*_DYNAMODB_TABLE` override. `custom.postsTableNamesByStage` keys on the
    # stage, so `local` already resolves to `local-posts` / `local-authInfo` through `*environment`.
    AWS_XRAY_CONTEXT_MISSING: LOG_ERROR
    PHOTOS_URL: http://localhost:3006/photos
    WORDS_URL: http://localhost:3006/words
    AWS_REGION: us-east-1
    # NOTE-RT: the thirteen `${ssm:…}` credentials from `*environment`, blanked. `provider.stage`
    # defaults to `local`, so `sls print` and `sls offline start` with no arguments render *this*
    # block - and resolving a real parameter would make both of them demand live AWS credentials,
    # which is exactly the local-development break the literal `custom.awsAccountId` exists to
    # avoid. Every source gates itself on its credential (see `src/lib/sources/*/index.js`), so an
    # empty value leaves that source switched off, which is what a local run wants anyway.
    FLICKR_API_KEY: ""
    FLICKR_API_SECRET: ""
    UNSPLASH_API_KEY: ""
    UNSPLASH_API_SECRET: ""
    TUMBLR_API_KEY: ""
    TUMBLR_API_SECRET: ""
    GITHUB_API_KEY: ""
    GITHUB_API_SECRET: ""
    YOUTUBE_API_KEY: ""
    VIMEO_ACCESS_TOKEN: ""
    STACKOVERFLOW_API_KEY: ""
    SOUNDCLOUD_ACCESS_TOKEN: ""
    SENTRY_DSN: ""
  functions:
    <<: *functions
    cachePosts:
      <<: *cachePosts
      events:
        - http:
            path: cache/posts
            method: get
            cors: *corsConfiguration


