dev: &devConfig
  environmentSecrets: &environmentSecrets
    FLICKR_API_KEY: flickr-api-key
    FLICKR_API_SECRET: flickr-api-secret
    UNSPLASH_API_KEY: unsplash-api-key
    UNSPLASH_API_SECRET: unsplash-api-secret
    TUMBLR_API_KEY: tumblr-api-key
    TUMBLR_API_SECRET: tumblr-api-secret
    LINKEDIN_API_KEY: linkedin-api-key
    LINKEDIN_API_SECRET: linkedin-api-secret
    GITHUB_API_KEY: github-api-key
    GITHUB_API_SECRET: github-api-secret
    SENTRY_DSN: sentry-dsn
  baseDomainName: ${self:provider.stage}.randytarampi.ca
  domainName: ${self:service}.${self:provider.baseDomainName}
  acmArn: arn:aws:acm:us-east-1:471964952458:certificate/ddc5763c-2f1e-48de-9bc7-aae1085cf915
  acmName: "*.dev.randytarampi.ca"
  kmsKeyArn: arn:aws:kms:us-east-1:471964952458:key/a83b4a56-95a6-4b38-8981-c32c67e3e8f3
  alarmTopic: arn:aws:sns:us-east-1:471964952458:CloudWatchNotifications
  environment: &environment
    CAMPAIGN_SOURCE: ${file(package.json):name}
    CAMPAIGN_CONTENT: ${file(package.json):version}
    ME_PERSON_NAME: ${file(src/serverless/util/loadConfig.cjs):default.me.person.name}
    ME_PERSON_JOB_TITLE: ${file(src/serverless/util/loadConfig.cjs):default.me.person.jobTitle}
    ME_PERSON_IMAGE: ${file(src/serverless/util/loadConfig.cjs):default.me.person.image}
    ME_PERSON_DESCRIPTION: ${file(src/serverless/util/loadConfig.cjs):default.me.person.description}
    ME_PERSON_EMAIL: ${file(src/serverless/util/loadConfig.cjs):default.me.person.email}
    SERVICE_POSTS_DYNAMODB_TABLE: ${self:provider.stage}-${self:service}-posts-2019-01-11
    SERVICE_AUTH_INFO_DYNAMODB_TABLE: ${self:provider.stage}-${self:service}-authInfo-2019-01-18
    FLICKR_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):default.me.profiles.Flickr.username}
    GITHUB_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):default.me.profiles.GitHub.username}
    UNSPLASH_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):default.me.profiles.Unsplash.username}
    TUMBLR_USER_NAME: ${file(src/serverless/util/loadConfig.cjs):default.me.profiles.Tumblr.username}
    SERVICE_POSTS_S3_BUCKET_NAME: randytarampi-${self:service}-${self:provider.stage}-posts
    FEED_URL: ${file(src/serverless/util/loadConfig.cjs):default.posts.feedUrl}
    BLOG_URL: ${file(src/serverless/util/loadConfig.cjs):default.www.publishUrl}${file(src/serverless/util/loadConfig.cjs):default.www.postsUrl}
    PHOTOS_URL: ${file(src/serverless/util/loadConfig.cjs):default.www.publishUrl}${file(src/serverless/util/loadConfig.cjs):default.www.photosUrl}
    WORDS_URL: ${file(src/serverless/util/loadConfig.cjs):default.www.publishUrl}${file(src/serverless/util/loadConfig.cjs):default.www.wordsUrl}
    WWW_URL: ${file(src/serverless/util/loadConfig.cjs):default.www.publishUrl}
    SERVERLESS_STAGE: ${self:provider.stage}
    SERVERLESS_SERVICE: ${self:service}
    LOGGER_ENABLED: ${file(src/serverless/util/loadConfig.cjs):default.logger.enabled}
    LOGGER_LEVEL: ${file(src/serverless/util/loadConfig.cjs):default.logger.level}
    LOGGER_SRC_ENABLED: ${file(src/serverless/util/loadConfig.cjs):default.logger.src}
    LOGGER_STREAM_HUMAN_ENABLED: ${file(src/serverless/util/loadConfig.cjs):default.logger.streams.human}
    LOGGER_STREAM_STDOUT_ENABLED: ${file(src/serverless/util/loadConfig.cjs):default.logger.streams.stdout}
    LOGGER_STREAM_SENTRY_ENABLED: ${file(src/serverless/util/loadConfig.cjs):default.logger.streams.sentry}
  functions: &functions
    cachePosts: &cachePosts
      events:
        - schedule:
            rate: cron(1 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - flickr
        - schedule:
            rate: cron(5 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - unsplash
        - schedule:
            rate: cron(8 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - s3
        - schedule:
            rate: cron(9 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - tumblr
        - schedule:
            rate: cron(10 0/1 * * ? *)
            input:
              postsSearchParameters:
                orderBy: datePublished
                orderOperator: ge
                relativeOrderComparatorAdjustment: P1W
                relativeOrderComparatorAdjustmentOperator: DateTime.minus
                relativeOrderComparatorAdjustmentType: Duration
                relativeOrderComparatorBasis: now
                relativeOrderComparatorBasisType: DateTime
                sources:
                  - github
    getPosts:
      events:
        - http:
            path: posts
            method: get
            cors: &corsConfiguration
              origin: "*"
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - X-Amz-User-Agent
                - ME-API-VERSION # NOTE-RT: It'd be really nice to just read this from a JS file, but then we'd need to babel everything before building the configuration, which is gross.
    getPostsRss:
      environment:
        CAMPAIGN_MEDIUM: rss
      events:
        - http:
            path: posts/feed.rss
            method: get
            cors: *corsConfiguration
prd:
  <<: *devConfig
  environment:
    <<: *environment
  baseDomainName: randytarampi.ca
  domainName: ${self:service}.${self:provider.baseDomainName}
  acmArn: arn:aws:acm:us-east-1:471964952458:certificate/b363d5a1-7db1-4504-94a1-1dbe9273ae62
  acmName: "*.randytarampi.ca"
  kmsKeyArn: arn:aws:kms:ca-central-1:471964952458:key/680708d1-fd35-4b54-af45-7adaba70f451
  alarmTopic: arn:aws:sns:ca-central-1:471964952458:CloudWatchNotifications

local:
  <<: *devConfig
  environment:
    <<: *environment
    SERVICE_POSTS_DYNAMODB_TABLE: local-posts
    SERVICE_AUTH_INFO_DYNAMODB_TABLE: local-authInfo
    AWS_XRAY_CONTEXT_MISSING: LOG_ERROR
    PHOTOS_URL: http://localhost:3006/photos
    WORDS_URL: http://localhost:3006/words
    AWS_REGION: us-east-1
  functions:
    <<: *functions
    cachePosts:
      <<: *cachePosts
      events:
        - http:
            path: cache/posts
            method: get
            cors: *corsConfiguration


