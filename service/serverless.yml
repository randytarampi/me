service: service

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x

  # NOTE-RT: `apiKeys` lives here, not directly under `provider`. Serverless v4's stricter schema
  # rejects `provider.apiKeys` as unrecognized - the framework itself now reads it from
  # `provider.apiGateway.apiKeys` (confirmed against the installed `serverless` package's compiled
  # source), a nesting change from older versions that this file predates.
  apiGateway:
    minimumCompressionSize: 1024
    apiKeys:
    - ${self:provider.stage}-${self:service}-user

  stage: ${opt:stage, 'local'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 30

  tracing:
    apiGateway: true
    lambda: true

  iamRoleStatements:
  - Effect: Allow
    Action:
    - KMS:Decrypt
    Resource: ${file(env.yml):${self:provider.stage}.kmsKeyArn}
  - Effect: Allow
    Action:
    - S3:ListBucket
    Resource: arn:aws:s3:::${self:provider.environment.SERVICE_POSTS_S3_BUCKET_NAME}
  - Effect: Allow
    Action:
    - S3:GetObject
    Resource: arn:aws:s3:::${self:provider.environment.SERVICE_POSTS_S3_BUCKET_NAME}/*
  - Effect: Allow
    Action:
    - SNS:Publish
    Resource:
      Ref: LambdaDeadLetterQueue
  - Effect: Allow
    Action:
    - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
  - Effect: Allow
    Action:
    - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}/*
  - Effect: Allow
    Action:
      - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
  - Effect: Allow
    Action:
      - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}/*
  - Effect: Allow
    Action:
      - lambda:InvokeFunction
    Resource: arn:aws:lambda:${self:provider.region}:${self:custom.awsAccountId}:function:${self:service}-${self:provider.stage}-*
  - Effect: Allow
    Action:
      - xray:PutTraceSegments
      - xray:PutTelemetryRecords
    Resource:
      - "*"

  # NOTE-RT: the credentials live in here too, as `${ssm:…}` references resolved at deploy time -
  # see `env.yml`. There is no separate `environmentSecrets` block and no `serverless-secrets`
  # plugin: its AWS provider `require`s the v2 `aws-sdk` as an uninstalled peer dependency, from a
  # `before:package:createDeploymentArtifacts` hook, so every `sls package` and `sls deploy` died
  # there. `sls print` never reaches that hook, which is why it looked healthy for years.
  environment: ${file(env.yml):${self:provider.stage}.environment}

build:
  esbuild:
    # NOTE-RT: this package is `"type": "module"`, so esbuild emits ESM. Lambda's `nodejs24.x`
    # runs with `--no-experimental-detect-module`, and the artifact's generated `package.json`
    # doesn't carry `"type": "module"`, so an ESM bundle named `.js` would be loaded as CommonJS
    # and die on its first `import`. `.mjs` makes the module format explicit to the runtime.
    # See https://docs.aws.amazon.com/lambda/latest/dg/lambda-nodejs.html#nodejs-handler-esm
    outExtension:
      '.js': '.mjs'
    sourcemap:
      type: linked
    minify: false
    # NOTE-RT: found live in `dev` - every `getPosts` invocation died at init with
    # `Dynamic require of "node:https" is not supported`. dynamoose -> @aws-sdk/client-dynamodb ->
    # @smithy/node-http-handler is CommonJS and calls `require("node:https")` internally; esbuild
    # bundles that call into the ESM output via a `__require2` shim that has no real `require` to
    # call in an ESM module, so it throws instead. This is documented, expected esbuild/ESM
    # behaviour, not a bug - see https://github.com/evanw/esbuild/issues/1921 and the Serverless
    # maintainers' own workaround at https://github.com/serverless/serverless/issues/13033. The
    # banner restores a working `require` in scope for exactly this case.
    banner:
      js: |
        import {createRequire} from "node:module";
        globalThis.require = createRequire(import.meta.url);

plugins:
- serverless-plugin-warmup
- serverless-offline
- serverless-domain-manager

custom:
  # NOTE-RT: deliberately a literal rather than `${aws:accountId}`. That variable is resolved by
  # an STS call, and a failed call is a hard error that no default value catches - so using it
  # would make `sls print` and `sls offline start` require live AWS credentials, breaking local
  # development. The account id is not a secret; the point here is to state it exactly once.
  awsAccountId: "471964952458"
  # NOTE-RT: the DynamoDB table names live here, and `env.yml` references them, rather than the
  # other way round. That is forced, not preferred.
  #
  # `resources.Resources.*DynamoDbTable.Properties` comes from
  # `src/serverless/dynamodb/{post,authInfo}.js`, which build the create-table request from the
  # dynamoose schema - so those files have to learn the stage's table name from somewhere. The only
  # resolver Serverless v4 hands a `${file(*.js)}` variable is `resolveConfigurationProperty`, and
  # it resolves `${self:…}` references but *not* `${file(…)}` ones: asked for
  # `["provider", "environment"]` it returns the literal string `${file(env.yml):prd.environment}`,
  # so indexing into it yields `undefined`. `resolveVariable`, the documented alternative, never
  # settles at all - awaiting it deadlocks the resolution pass and `sls print` emits no `resources`.
  # A `self:`-only expression is the one shape both the YAML and the JavaScript can read.
  #
  # The dates are the tables' 2019 creation dates, not a naming convention, so each stage is spelled
  # out rather than composed from `${self:provider.stage}-${self:service}-…`. Renaming one stage's
  # table then cannot silently rename another's - and `prd`'s holds 1,666 posts.
  postsTableNamesByStage:
    local: local-posts
    dev: dev-service-posts-2019-01-11
    prd: prd-service-posts-2019-01-11
  authInfoTableNamesByStage:
    local: local-authInfo
    dev: dev-service-authInfo-2019-01-18
    prd: prd-service-authInfo-2019-01-18
  postsTableName: ${self:custom.postsTableNamesByStage.${self:provider.stage}}
  authInfoTableName: ${self:custom.authInfoTableNamesByStage.${self:provider.stage}}
  # NOTE-RT: these two used to live directly under `provider`, purely as shared values for `env.yml`
  # to reference back (`${self:provider.baseDomainName}`) rather than repeating the `${file(env.yml):…}`
  # lookup. Serverless v4's stricter schema rejects unrecognized `provider` properties - neither is
  # a real core or plugin-defined property, so they moved here, where `custom` tolerates anything.
  baseDomainName: ${file(env.yml):${self:provider.stage}.baseDomainName}
  domainName: ${file(env.yml):${self:provider.stage}.domainName}
  # NOTE-RT: no `dynamodb:` block, and no `serverless-dynamodb` plugin. The local database is a
  # `localstack/localstack` container started by `service/package.json`'s `localstack:*` scripts,
  # and the tables are created by `src/serverless/dynamodb/migrate.js` against it. Nothing about
  # the local database needs to be a Serverless plugin - it was one only because DynamoDB Local
  # needed a JAR downloaded and a JVM started, which is exactly the dependency this removes.
  #
  # NOTE-RT: no `serverlessSecrets:` block either, and nothing replaces it. The credentials are
  # `${ssm:…}` references in `env.yml`, each with a `, ''` default (decided 2026-08-29 - see the
  # comment there), so there is no `throwOnMissingSecret` to set, no KMS alias to name per stage
  # (SSM decrypts `SecureString` parameters itself), and no `package.patterns` entry for a
  # `.serverless-secrets.json` manifest that no longer gets written. The execution role also loses
  # the wildcard `ssm:GetParameters` the plugin injected at `before:package:setupProviderConfiguration`.
  alarmTopic: ${file(env.yml):${self:provider.stage}.alarmTopic}
  serverless-offline:
    httpPort: ${file(src/serverless/util/loadConfig.cjs):posts.serverPort}
    noPrependStageInUrl: true
  customDomain:
    domainName: ${file(env.yml):${self:provider.stage}.domainName}
    certificateName: ${file(env.yml):${self:provider.stage}.acmName}
    # NOTE-RT: stated outright because it decides which region the certificate is looked up in.
    # `prd` deploys to `ca-central-1` but both stages' `acmArn` live in `us-east-1` (see `env.yml`),
    # which is only correct for an edge-optimized endpoint - leaving it to the plugin's default
    # made a working deploy depend on that default never changing.
    endpointType: edge
    createRoute53Record: true
    basePath: ""
  # NOTE-RT: `default` names the (only) warmer. Serverless v4's stricter schema requires every
  # warmer to be an object keyed by name under `custom.warmup`, and functions opt in the same way
  # (`warmup.default.enabled`) - the old flat `custom.warmup.prewarm` / `functions.*.warmup.enabled`
  # shape errored with "must be object" and "Every warmer should be declared in the custom section".
  warmup:
    default:
      prewarm: true

# NOTE-RT: can't just go `${file(env.yml):${self:provider.stage}.functions}` - `env.yml` carries
# only each function's `events` (plus `getPostsRss`'s `CAMPAIGN_MEDIUM`), because those are the
# stage-dependent parts. `handler`, `timeout`, `onError` and `warmup` are the same everywhere and
# live here, so the block is assembled rather than referenced wholesale.
functions:
  cachePosts:
    handler: src/serverless/handlers/cachePosts/initialized.default
    timeout: 90
    events: ${file(env.yml):${self:provider.stage}.functions.cachePosts.events}
    onError:
      Ref: LambdaDeadLetterQueue
  getPosts:
    handler: src/serverless/handlers/getPosts/initialized.default
    events: ${file(env.yml):${self:provider.stage}.functions.getPosts.events}
    onError:
      Ref: LambdaDeadLetterQueue
    warmup:
      default:
        enabled: true
  getPostsRss:
    handler: src/serverless/handlers/getPostsRss/initialized.default
    events: ${file(env.yml):${self:provider.stage}.functions.getPostsRss.events}
    onError:
      Ref: LambdaDeadLetterQueue
    environment:
      CAMPAIGN_MEDIUM: rss
    warmup:
      default:
        enabled: true

resources:
  Resources:
    LambdaDeadLetterQueue:
      Type: AWS::SNS::Topic
      Properties:
        DisplayName: ${self:provider.stage}-${self:service}-lambda-dlq
        TopicName: ${self:provider.stage}-${self:service}-lambda-dlq
    LambdaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: Lambda errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        EvaluationPeriods: 1
        Namespace: AWS/Lambda
        MetricName: Errors
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    LambdaDurationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: Long running lambdas
        ComparisonOperator: GreaterThanOrEqualToThreshold
        EvaluationPeriods: 1
        Namespace: AWS/Lambda
        MetricName: Duration
        Threshold: 45000
        Period: 60
        Statistic: Maximum
        Unit: Milliseconds
    ApiGateway4xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: 4xx Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
        - Value: ${self:provider.stage}-${self:service}
          Name: ApiName
        - Value: ${self:provider.stage}
          Name: Stage
        EvaluationPeriods: 1
        Namespace: AWS/ApiGateway
        MetricName: 4XXError
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    ApiGateway5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: 5xx Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
        - Value: ${self:provider.stage}-${self:service}
          Name: ApiName
        - Value: ${self:provider.stage}
          Name: Stage
        EvaluationPeriods: 1
        Namespace: AWS/ApiGateway
        MetricName: 5XXError
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    PostsDynamoDbConsumedReadCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB RCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedReadCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 6000
    PostsDynamoDbConsumedWriteCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB WCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedWriteCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 6000
    PostsDynamoDbSystemErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB System Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: SystemErrors
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    AuthInfoDynamoDbConsumedReadCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB RCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedReadCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 5
    AuthInfoDynamoDbConsumedWriteCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB WCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedWriteCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 5
    AuthInfoDynamoDbSystemErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB System Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: SystemErrors
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    S3BucketPosts:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.SERVICE_POSTS_S3_BUCKET_NAME}
    # NOTE-RT: these two files used to resolve their `TableName` from
    # `process.env.SERVICE_*_DYNAMODB_TABLE` in the *CLI* process, where it is never set - those are
    # Lambda environment variables from `env.yml`. `src/serverless/dynamodb/util.js`'s `setupLocal()`
    # unconditionally defaulted them, so every rendered template declared `TableName: local-posts` /
    # `local-authInfo` while `provider.environment` - and every IAM resource ARN above and every
    # alarm `TableName` dimension below - said `${stage}-service-posts-…`.
    #
    # Checked against the live account on 2026-08-02, because the answer decides whether this is a
    # cosmetic misalignment or a data-loss trap:
    #
    #   $ aws cloudformation get-template --stack-name service-prd --region ca-central-1 \
    #       --query 'TemplateBody.Resources.PostsDynamoDbTable.Properties.TableName'
    #   "prd-service-posts-2019-01-11"
    #   $ aws dynamodb list-tables --region ca-central-1
    #   ["prd-service-authInfo-2019-01-18", "prd-service-posts-2019-01-11"]
    #
    # The live stack has always declared the correct names, and `local-posts`/`local-authInfo` have
    # never existed in `ca-central-1`. So the bug was in the *current source* only, and deploying it
    # unfixed would have renamed a table holding 1,666 posts - which CloudFormation performs as a
    # replacement. `DeletionPolicy: Retain` would have orphaned rather than deleted the real table,
    # but production would have come back up reading an empty one.
    #
    # Both files now resolve `custom.postsTableName` / `custom.authInfoTableName`, which `env.yml`
    # also references, so `TableName` and `SERVICE_*_DYNAMODB_TABLE` are the same string by
    # construction. Verify after any change to either - and poison the environment while you do it,
    # because that is what distinguishes a working resolution from a silent fallback:
    #
    #   for s in local dev prd; do
    #     SERVICE_POSTS_DYNAMODB_TABLE=POISONED yarn sls print --stage "$s" \
    #       | grep -E 'TableName|_DYNAMODB_TABLE'
    #   done
    PostsDynamoDbTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties: ${file(src/serverless/dynamodb/post.js)}
    AuthInfoDynamoDbTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties: ${file(src/serverless/dynamodb/authInfo.js)}
