service: service

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x

  apiGateway:
    minimumCompressionSize: 1024

  stage: ${opt:stage, 'local'}
  region: ${opt:region, 'us-east-1'}
  baseDomainName: ${file(env.yml):${self:provider.stage}.baseDomainName}
  domainName: ${file(env.yml):${self:provider.stage}.domainName}
  memorySize: 256
  timeout: 30

  tracing:
    apiGateway: true
    lambda: true

  apiKeys:
  - ${self:provider.stage}-${self:service}-user

  iamRoleStatements:
  - Effect: Allow
    Action:
    - KMS:Decrypt
    Resource: ${file(env.yml):${self:provider.stage}.kmsKeyArn}
  - Effect: Allow
    Action:
    - S3:ListBucket
    Resource: arn:aws:s3:::${self:provider.environment.SERVICE_POSTS_S3_BUCKET_NAME}
  - Effect: Allow
    Action:
    - S3:GetObject
    Resource: arn:aws:s3:::${self:provider.environment.SERVICE_POSTS_S3_BUCKET_NAME}/*
  - Effect: Allow
    Action:
    - SNS:Publish
    Resource:
      Ref: LambdaDeadLetterQueue
  - Effect: Allow
    Action:
    - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
  - Effect: Allow
    Action:
    - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}/*
  - Effect: Allow
    Action:
      - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
  - Effect: Allow
    Action:
      - dynamodb:*
    Resource: arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}/*
  - Effect: Allow
    Action:
      - lambda:InvokeFunction
    Resource: arn:aws:lambda:${self:provider.region}:${self:custom.awsAccountId}:function:${self:service}-${self:provider.stage}-*
  - Effect: Allow
    Action:
      - xray:PutTraceSegments
      - xray:PutTelemetryRecords
    Resource:
      - "*"

  environment: ${file(env.yml):${self:provider.stage}.environment}
  environmentSecrets: # NOTE-RT: Can't just go `${file(env.yml):${self:provider.stage}.environmentSecrets}` because `serverless-secrets` makes assumptions about what's actually in your configuration file
    FLICKR_API_KEY: ${file(env.yml):${self:provider.stage}.environmentSecrets.FLICKR_API_KEY}
    FLICKR_API_SECRET: ${file(env.yml):${self:provider.stage}.environmentSecrets.FLICKR_API_SECRET}
    UNSPLASH_API_KEY: ${file(env.yml):${self:provider.stage}.environmentSecrets.UNSPLASH_API_KEY}
    UNSPLASH_API_SECRET: ${file(env.yml):${self:provider.stage}.environmentSecrets.UNSPLASH_API_SECRET}
    TUMBLR_API_KEY: ${file(env.yml):${self:provider.stage}.environmentSecrets.TUMBLR_API_KEY}
    TUMBLR_API_SECRET: ${file(env.yml):${self:provider.stage}.environmentSecrets.TUMBLR_API_SECRET}
    SENTRY_DSN: ${file(env.yml):${self:provider.stage}.environmentSecrets.SENTRY_DSN}
    # NOTE-RT: `env.yml` also names SSM parameters for the GitHub, YouTube, Vimeo, StackOverflow
    # and SoundCloud sources, but they're deliberately not listed here yet. `custom.serverlessSecrets
    # .throwOnMissingSecret` is `true`, so naming a parameter that doesn't exist in Parameter Store
    # makes `configureEnvironment.js` throw and takes *every* function down, not just that source.
    # To enable one: create the SSM parameter, add its identifier to `config/me/profiles.cjs`
    # (see `env.yml`), then add its key here.

build:
  esbuild:
    # NOTE-RT: this package is `"type": "module"`, so esbuild emits ESM. Lambda's `nodejs24.x`
    # runs with `--no-experimental-detect-module`, and the artifact's generated `package.json`
    # doesn't carry `"type": "module"`, so an ESM bundle named `.js` would be loaded as CommonJS
    # and die on its first `import`. `.mjs` makes the module format explicit to the runtime.
    # See https://docs.aws.amazon.com/lambda/latest/dg/lambda-nodejs.html#nodejs-handler-esm
    outExtension:
      '.js': '.mjs'
    sourcemap:
      type: linked
    minify: false

package:
  patterns:
    # NOTE-RT: `serverless-secrets` writes this manifest next to `serverless.yml` at package time
    # and `src/serverless/util/loadServerlessSecrets.js` reads it from `process.cwd()` at runtime,
    # so it has to sit at the root of the artifact. `copy-webpack-plugin` used to put it there.
    - .serverless-secrets.json

plugins:
- serverless-secrets
- serverless-plugin-warmup
- serverless-offline
- serverless-domain-manager

custom:
  # NOTE-RT: deliberately a literal rather than `${aws:accountId}`. That variable is resolved by
  # an STS call, and a failed call is a hard error that no default value catches - so using it
  # would make `sls print` and `sls offline start` require live AWS credentials, breaking local
  # development. The account id is not a secret; the point here is to state it exactly once.
  awsAccountId: "471964952458"
  # NOTE-RT: no `dynamodb:` block, and no `serverless-dynamodb` plugin. The local database is a
  # `localstack/localstack` container started by `service/package.json`'s `localstack:*` scripts,
  # and the tables are created by `src/serverless/dynamodb/migrate.js` against it. Nothing about
  # the local database needs to be a Serverless plugin - it was one only because DynamoDB Local
  # needed a JAR downloaded and a JVM started, which is exactly the dependency this removes.
  serverlessSecrets:
    throwOnMissingSecret: true
    providerOptions:
      region: ${self:provider.region}
    keys:
      dev: "alias/serverless-dev"
      prd: "alias/serverless-prd"
  alarmTopic: ${file(env.yml):${self:provider.stage}.alarmTopic}
  serverless-offline:
    httpPort: ${file(src/serverless/util/loadConfig.cjs):posts.serverPort}
    noPrependStageInUrl: true
  customDomain:
    domainName: ${file(env.yml):${self:provider.stage}.domainName}
    certificateName: ${file(env.yml):${self:provider.stage}.acmName}
    # NOTE-RT: stated outright because it decides which region the certificate is looked up in.
    # `prd` deploys to `ca-central-1` but both stages' `acmArn` live in `us-east-1` (see `env.yml`),
    # which is only correct for an edge-optimized endpoint - leaving it to the plugin's default
    # made a working deploy depend on that default never changing.
    endpointType: edge
    createRoute53Record: true
    basePath: ""
  warmup:
    prewarm: true

functions: # NOTE-RT: Can't just go `${file(env.yml):${self:provider.stage}.functions}` because `serverless-secrets` makes assumptions about what's actually in your configuration file
  cachePosts:
    handler: src/serverless/handlers/cachePosts/initialized.default
    timeout: 90
    events: ${file(env.yml):${self:provider.stage}.functions.cachePosts.events}
    onError:
      Ref: LambdaDeadLetterQueue
  getPosts:
    handler: src/serverless/handlers/getPosts/initialized.default
    events: ${file(env.yml):${self:provider.stage}.functions.getPosts.events}
    onError:
      Ref: LambdaDeadLetterQueue
    warmup:
      enabled: true
  getPostsRss:
    handler: src/serverless/handlers/getPostsRss/initialized.default
    events: ${file(env.yml):${self:provider.stage}.functions.getPostsRss.events}
    onError:
      Ref: LambdaDeadLetterQueue
    environment:
      CAMPAIGN_MEDIUM: rss
    warmup:
      enabled: true

resources:
  Resources:
    LambdaDeadLetterQueue:
      Type: AWS::SNS::Topic
      Properties:
        DisplayName: ${self:provider.stage}-${self:service}-lambda-dlq
        TopicName: ${self:provider.stage}-${self:service}-lambda-dlq
    LambdaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: Lambda errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        EvaluationPeriods: 1
        Namespace: AWS/Lambda
        MetricName: Errors
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    LambdaDurationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: Long running lambdas
        ComparisonOperator: GreaterThanOrEqualToThreshold
        EvaluationPeriods: 1
        Namespace: AWS/Lambda
        MetricName: Duration
        Threshold: 45000
        Period: 60
        Statistic: Maximum
        Unit: Milliseconds
    ApiGateway4xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: 4xx Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
        - Value: ${self:provider.stage}-${self:service}
          Name: ApiName
        - Value: ${self:provider.stage}
          Name: Stage
        EvaluationPeriods: 1
        Namespace: AWS/ApiGateway
        MetricName: 4XXError
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    ApiGateway5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: 5xx Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
        - Value: ${self:provider.stage}-${self:service}
          Name: ApiName
        - Value: ${self:provider.stage}
          Name: Stage
        EvaluationPeriods: 1
        Namespace: AWS/ApiGateway
        MetricName: 5XXError
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    PostsDynamoDbConsumedReadCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB RCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedReadCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 6000
    PostsDynamoDbConsumedWriteCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB WCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedWriteCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 6000
    PostsDynamoDbSystemErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
        - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB System Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_POSTS_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: SystemErrors
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    AuthInfoDynamoDbConsumedReadCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB RCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedReadCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 5
    AuthInfoDynamoDbConsumedWriteCapacityUnitsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB WCU Consumption
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: ConsumedWriteCapacityUnits
        Period: 60
        Statistic: Sum
        Threshold: 5
    AuthInfoDynamoDbSystemErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - ${self:custom.alarmTopic}
        AlarmDescription: DynamoDB System Errors
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Value: ${self:provider.environment.SERVICE_AUTH_INFO_DYNAMODB_TABLE}
            Name: TableName
        EvaluationPeriods: 1
        Namespace: AWS/DynamoDB
        MetricName: SystemErrors
        Period: 60
        Statistic: Sum
        Threshold: 1
        Unit: Count
    S3BucketPosts:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.SERVICE_POSTS_S3_BUCKET_NAME}
    # NOTE-RT: STOP AND READ BEFORE THE FIRST DEPLOY. These two files resolve their `TableName`
    # from `process.env.SERVICE_*_DYNAMODB_TABLE` in the *CLI* process, which is never set there -
    # those are Lambda environment variables from `env.yml`. `src/serverless/dynamodb/util.js`'s
    # `setupLocal()` therefore defaults them, so `sls print --stage prd` renders
    # `TableName: local-posts` / `local-authInfo` while `provider.environment` correctly says
    # `prd-service-posts-2019-01-11` / `prd-service-authInfo-2019-01-18`. The stack declares one
    # pair of tables and the functions read another.
    #
    # This is long-standing - unchanged since before the monorepo relocation, so the live 2022 stack
    # was deployed this way too - and it is deliberately NOT fixed here. Correcting the name is a
    # `TableName` change, i.e. a CloudFormation *replacement* of a live DynamoDB table. Before
    # touching it, establish against the real stack which tables actually exist:
    #
    #   aws cloudformation get-template --stack-name service-prd \
    #     --query 'TemplateBody.Resources.PostsDynamoDbTable.Properties.TableName'
    #   aws dynamodb list-tables --region ca-central-1
    #
    # `DeletionPolicy: Retain` means a replacement orphans rather than deletes the old table, but if
    # the target name already exists the update fails with `already exists` mid-deploy. Whichever
    # name wins, `provider.environment` and these resources have to agree afterwards.
    PostsDynamoDbTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties: ${file(src/serverless/dynamodb/post.js)}
    AuthInfoDynamoDbTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties: ${file(src/serverless/dynamodb/authInfo.js)}
