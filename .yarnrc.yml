# NOTE-RT: not `[]`, the Yarn default, because `packages/js` genuinely depends on two forks of
# abandoned packages - `github:randytarampi/georaptor#me-release` and
# `github:randytarampi/proximityhash#me-release`. It is no longer `["**"]` either: that existed to
# permit `github:RishitKedia/serverless-secrets`, a stranger's fork pinned to a mutable branch,
# which is gone. This allowlist is the honest middle - the forks still install, and no third-party
# repository on the internet is fetchable.
approvedGitRepositories:
  - "github.com/randytarampi/*"

enableScripts: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.17.0.cjs
