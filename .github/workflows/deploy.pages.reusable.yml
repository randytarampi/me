name: deploy.pages.reusable

on:
  workflow_call:
    inputs:
      application_name:
        description: 'The application to deploy'
        required: true
        type: string
      deployment_environment:
        description: 'The targeted `DEPLOYMENT_ENVIRONMENT`'
        required: true
        type: string
      deployment_ref:
        description: 'The ref or SHA used in deployment metadata'
        required: true
        type: string
      adjust_docs_for_dev:
        description: 'Whether to rewrite the dev CNAME before deployment'
        required: false
        default: false
        type: boolean
    secrets:
      # NOTE-RT: the AWS credentials are gone. They were injected as job-level `env` for years and
      # nothing here ever read them — `www` declares no AWS dependency at all, and the repo's only
      # `@aws-sdk` consumers live in `service`. Removing them is not a migration, it's a deletion.
      GH_PAGES_DEPLOYMENT_TOKEN:
        required: true

jobs:
  deploy:
    name: Run `yarn deploy`
    # NOTE-RT: `on.workflow_call` can't declare an `environment`, but a *job* inside one can —
    # `deploy.service.yml` has done it all along. Setting it here buys two things at once: the
    # `master`-only deployment branch policy from `infrastructure/src/github/environments.ts`, and
    # an environment-scoped OIDC `sub` claim if this job ever needs a cloud credential again.
    environment: ${{ inputs.deployment_environment }}
    env:
      DEPLOY: true
      APPLICATION_NAME: ${{ inputs.application_name }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
      DEPLOYMENT_REF: ${{ inputs.deployment_ref }}
      GITHUB_ACTIONS_AUTHOR_EMAIL: github@randytarampi.ca
      GITHUB_ACTIONS_AUTHOR_NAME: deploy.pages
    runs-on:
      - ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Set variables
        id: variables
        run: |
          {
            echo "application_name=$APPLICATION_NAME"
            echo "deployment_environment=$DEPLOYMENT_ENVIRONMENT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "NODE_ENV=$DEPLOYMENT_ENVIRONMENT"
            echo "PRINTABLE_PUPPETEER_NO_SANDBOX=$CI"
            echo "CPU_ARCH=$RUNNER_ARCH"
            echo "OS_NAME=$RUNNER_OS"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo "COMMIT_SHA=$GITHUB_SHA"
            echo "BUILD_NUMBER=$GITHUB_RUN_ID"
            echo "JOB_NUMBER=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup node@24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Setup dependencies on build runner
        run: |
          sudo apt-get update
          # NOTE-RT: `--yes` because relying on the runner image's assume-yes default is a wager on
          # someone else's config; `'japan*'` quoted because apt takes it as a regex, and unquoted
          # the shell would glob it against the working directory first.
          sudo apt-get install --yes language-pack-ja 'japan*' fonts-wqy-microhei ttf-wqy-microhei

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Actually run `yarn install`
        run: yarn install

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            nx-cache-${{ runner.os }}-${{ github.ref_name }}-
            nx-cache-${{ runner.os }}-

      # NOTE-RT: this used to be `chrnorm/deployment-action@releases/v1`, which declares
      # `runs.using: node12` and emits the disabled `::set-output` command. `on.workflow_call`
      # can't declare an `environment:`, so the GitHub deployment has to be created by hand.
      - name: Setup for deployment
        id: deployment
        uses: actions/github-script@v8
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: `\`${process.env.APPLICATION_NAME}\` @ ${process.env.DEPLOYMENT_REF}`,
              auto_merge: false,
              required_contexts: []
            });

            core.setOutput("deployment_id", deployment.data.id);
      - name: Build `docs`
        run: |
          yarn lerna run resume --scope=jsonresume-theme-*;
          yarn lerna run docs --scope="*/${{ steps.variables.outputs.application_name }}" --scope="*${{ steps.variables.outputs.application_name }}*"
      - name: Adjust `docs` for `dev`
        if: ${{ inputs.adjust_docs_for_dev }}
        run: |
          git config --local user.email "$GITHUB_ACTIONS_AUTHOR_EMAIL"
          git config --local user.name "$GITHUB_ACTIONS_AUTHOR_NAME"
          echo "www.dev.randytarampi.ca" > ${{ steps.variables.outputs.application_name }}/docs/CNAME;
          if [ -d "${{ steps.variables.outputs.application_name }}/docs" ]; then git add --verbose --force --all ${{ steps.variables.outputs.application_name }}/docs; fi;
          if [[ -n $(git status -s) ]]; then git commit -m "release: Prepare to deploy \`${{ steps.variables.outputs.application_name }}\` to ${{ github.repository_owner }}.github.io.git"; fi;
      - name: Actually deploy (www/dev)
        if: ${{ inputs.application_name == 'www' && inputs.deployment_environment == 'dev' }}
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          git-config-email: ${{ env.GITHUB_ACTIONS_AUTHOR_EMAIL }}
          git-config-name: ${{ env.GITHUB_ACTIONS_AUTHOR_NAME }} (www/dev)
          force: true
          clean: true
          branch: master
          folder: ${{ steps.variables.outputs.application_name }}/docs
          repository-name: ${{ github.repository_owner }}/${{ github.repository_owner }}.github.io
          token: ${{ secrets.GH_PAGES_DEPLOYMENT_TOKEN }}
        timeout-minutes: 10
      - name: Actually deploy (www/prd)
        if: ${{ inputs.application_name == 'www' && inputs.deployment_environment == 'prd' }}
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          git-config-email: ${{ env.GITHUB_ACTIONS_AUTHOR_EMAIL }}
          git-config-name: ${{ env.GITHUB_ACTIONS_AUTHOR_NAME }} (www/prd)
          single-commit: true
          force: true
          clean: true
          branch: gh-pages
          folder: ${{ steps.variables.outputs.application_name }}/docs
          token: ${{ secrets.GH_PAGES_DEPLOYMENT_TOKEN }}
        timeout-minutes: 10
      - name: Actually deploy (jsonresume-theme/prd)
        if: ${{ inputs.application_name == 'jsonresume-theme' && inputs.deployment_environment == 'prd' }}
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          git-config-email: ${{ env.GITHUB_ACTIONS_AUTHOR_EMAIL }}
          git-config-name: ${{ env.GITHUB_ACTIONS_AUTHOR_NAME }} (jsonresume-theme/prd)
          force: true
          clean: true
          branch: master
          folder: ${{ steps.variables.outputs.application_name }}/docs
          repository-name: ${{ github.repository_owner }}/me.resume
          token: ${{ secrets.GH_PAGES_DEPLOYMENT_TOKEN }}
        timeout-minutes: 10
      - name: Handle deployment (success)
        if: success()
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success"
            });
      - name: Handle deployment (failure)
        if: failure()
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure"
            });
