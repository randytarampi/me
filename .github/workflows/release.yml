name: release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Branch protection is still required to prevent direct pushes to master from bypassing CI.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.actor != 'github-actions[bot]' }}
    environment: prd
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changed.outputs.has_changes }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node@24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            nx-cache-${{ runner.os }}-${{ github.ref_name }}-
            nx-cache-${{ runner.os }}-

      - name: Check for publishable changes
        id: changed
        run: |
          if [ -n "$(yarn lerna changed -alp || true)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: yarn lerna run build

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Version packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        id: version
        run: |
          yarn lerna version --conventional-commits --yes
          RELEASE_VERSION=$(node -p 'require("./lerna.json").version')
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: |
          yarn lerna run letter --scope=@randy.tarampi/letter
          yarn lerna run resume --scope=@randy.tarampi/resume
          yarn lerna run resume --scope=jsonresume-theme-randytarampi
          yarn lerna run docs --scope=@randy.tarampi/letter
          yarn lerna run docs --scope=@randy.tarampi/resume
          yarn lerna run docs --scope=jsonresume-theme-randytarampi
          yarn lerna run docs --scope=@randy.tarampi/www

      - name: Create release tarball
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: tar -czf me.tar.gz --exclude=.git --exclude=node_modules --exclude=.yarn/cache .

      # NOTE-RT: no `NODE_AUTH_TOKEN`, and no `NPM_TOKEN` secret behind it. Lerna 9 performs npm's
      # OIDC exchange itself — it requests a token with audience `npm:registry.npmjs.org`, trades it
      # per-package at `/-/npm/v1/oidc/token/exchange/package/<name>`, and enables provenance on its
      # own when the repository and package are both public, which is why `--provenance` is gone
      # too. The trust relationships are declared in `infrastructure/src/npm/trustedPublishers.ts`.
      #
      # `setup-node`'s `registry-url` above still writes an `.npmrc` line referencing
      # `NODE_AUTH_TOKEN`, which now resolves empty; Lerna sets its own token in `user` config,
      # which takes precedence. That precedence is asserted here rather than verified, so the first
      # release must be run with `--loglevel verbose` — Lerna's OIDC helper never throws, so a
      # skipped exchange looks like a plain auth failure and the `oidc` breadcrumbs are the only
      # way to tell the two apart.
      - name: Publish packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: yarn lerna publish from-git --yes --loglevel verbose

      - name: Publish GitHub release
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # NOTE-RT: no `nullglob`. A pattern that matches nothing used to vanish silently, so a
          # release could be published with no assets at all and nothing would say so.
          assets=()
          for pattern in \
            "me.tar.gz" \
            "packages/jsonresume-theme/docs/resume.*.pdf" \
            "resume/docs/resume.*.pdf" \
            "letter/docs/letter.*.pdf"
          do
            # shellcheck disable=SC2206 # deliberate: $pattern is a glob and must be expanded
            matched=($pattern)
            if [ ! -e "${matched[0]}" ]; then
              echo "::error::No release asset matched '$pattern'"
              exit 1
            fi
            assets+=("${matched[@]}")
          done

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --notes "" \
            "${assets[@]}"

  # NOTE-RT: deploys hang off `release` directly rather than off the `v*` tag it pushes. Tags
  # pushed with the checkout-persisted `GITHUB_TOKEN` never create a workflow run, so the tag
  # triggers these workflows used to carry could not fire — production has not deployed since
  # 2022-04-24. Calling them here also keeps one release and its deploys in a single run.
  deploy-pages:
    needs: release
    if: ${{ needs.release.outputs.has_changes == 'true' }}
    uses: ./.github/workflows/deploy.pages.yml
    with:
      application_name: www
      deployment_environment: prd
    secrets:
      GH_PAGES_DEPLOYMENT_TOKEN: ${{ secrets.GH_PAGES_DEPLOYMENT_TOKEN }}
    permissions:
      contents: write
      deployments: write

  deploy-pages--jsonresume-theme:
    needs: release
    if: ${{ needs.release.outputs.has_changes == 'true' }}
    uses: ./.github/workflows/deploy.pages.yml
    with:
      application_name: jsonresume-theme
      deployment_environment: prd
    secrets:
      GH_PAGES_DEPLOYMENT_TOKEN: ${{ secrets.GH_PAGES_DEPLOYMENT_TOKEN }}
    permissions:
      contents: write
      deployments: write

  deploy-service:
    needs: release
    if: ${{ needs.release.outputs.has_changes == 'true' }}
    uses: ./.github/workflows/deploy.service.yml
    with:
      deployment_environment: prd
    # NOTE-RT: no `secrets:` at all. The deploy assumes an OIDC role and reads the Serverless
    # licence key from SSM, so there is nothing left here to hand down.
