name: release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Branch protection is still required to prevent direct pushes to master from bypassing CI.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.actor != 'github-actions[bot]' }}
    environment: prd
    runs-on: ubuntu-latest
    steps:
      - name: Run `git checkout`
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node@24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install

      - name: Check for publishable changes
        id: changed
        run: |
          if [ -n "$(yarn lerna changed -alp || true)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: yarn lerna run build

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Version packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        id: version
        run: |
          yarn lerna version --conventional-commits --yes
          RELEASE_VERSION=$(node -p 'require("./lerna.json").version')
          echo "tag=v$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Build release artifacts
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: |
          yarn lerna run letter --scope=@randy.tarampi/letter
          yarn lerna run resume --scope=@randy.tarampi/resume
          yarn lerna run resume --scope=jsonresume-theme-randytarampi
          yarn lerna run docs --scope=@randy.tarampi/letter
          yarn lerna run docs --scope=@randy.tarampi/resume
          yarn lerna run docs --scope=jsonresume-theme-randytarampi
          yarn lerna run docs --scope=@randy.tarampi/www

      - name: Create release tarball
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: tar -czf me.tar.gz --exclude=.git --exclude=node_modules --exclude=.yarn/cache .

      - name: Publish packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn lerna publish from-git --yes --provenance

      - name: Publish GitHub release
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # NOTE-RT: no `nullglob`. A pattern that matches nothing used to vanish silently, so a
          # release could be published with no assets at all and nothing would say so.
          assets=()
          for pattern in \
            "me.tar.gz" \
            "packages/jsonresume-theme/docs/resume.*.pdf" \
            "resume/docs/resume.*.pdf" \
            "letter/docs/letter.*.pdf"
          do
            # shellcheck disable=SC2206 # deliberate: $pattern is a glob and must be expanded
            matched=($pattern)
            if [ ! -e "${matched[0]}" ]; then
              echo "::error::No release asset matched '$pattern'"
              exit 1
            fi
            assets+=("${matched[@]}")
          done

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --notes "" \
            "${assets[@]}"
