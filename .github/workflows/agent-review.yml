# Stable dispatcher stub: trigger parsing lives in the reusable workflow
# (randytarampi/dotfiles) at the immutable trusted ref ab5077e30ad822c31be9e129d1bc2b4265c95ba7.
# Only touch this file to add trigger events or change permissions.
name: Agent review dispatcher

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@ab5077e30ad822c31be9e129d1bc2b4265c95ba7
    with:
      event_json: ${{ toJson(github.event) }}
      trusted_ref: ab5077e30ad822c31be9e129d1bc2b4265c95ba7
    secrets: inherit
