# Stable dispatcher stub: trigger parsing lives in the reusable workflow
# (randytarampi/dotfiles) so improvements land automatically via @main.
# Only touch this file to add trigger events or change permissions.
name: Agent review dispatcher

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@main
    with:
      event_json: ${{ toJson(github.event) }}
    secrets: inherit
