name: deploy (service)

on:
  workflow_call:
    inputs:
      deployment_environment:
        description: 'The deployment environment'
        required: true
        type: string
    # NOTE-RT: no `secrets:`. The AWS credentials are gone — this job assumes
    # `me-deploy-service-<stage>` via OIDC (see `infrastructure/src/aws/oidc.ts`) — and the
    # Serverless Framework licence key is read from SSM at `/serverless-framework/license-key`,
    # which the deploy role can already reach because resolving `env.yml`'s `${ssm:...}` credential
    # references needs `ssm:GetParameter` regardless.
    # See https://www.serverless.com/framework/docs/guides/license-keys

  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'The deployment environment'
        required: true
        default: prd
        type: choice
        options:
          - dev
          - prd

concurrency:
  group: deploy-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # NOTE-RT: back, and now actually used — `configure-aws-credentials` has a `role-to-assume` below,
  # so this job really does need to mint an OIDC token. It was previously requested and unused,
  # which is its own kind of lie about what a workflow does.
  id-token: write

jobs:
  deploy-service:
    environment: ${{ inputs.deployment_environment }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: ${{ inputs.deployment_environment }}
    steps:
      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node@24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build workspace dependencies
        # NOTE-RT: `service` has no `build` script of its own, but its Serverless file resolvers
        # (`src/serverless/dynamodb/*.js`) import `@randy.tarampi/js`, `@randy.tarampi/lambda-logger`
        # and `@randy.tarampi/serverless` by their `esm/` entry points — a fresh checkout has never
        # compiled those. Unlike `test.yml`, this job never runs an Nx target with `dependsOn:
        # ["^build"]`, so nothing builds those dependencies implicitly; found the hard way as
        # `Cannot find package '…/@randy.tarampi/lambda-logger/esm/index.js'` on the first real
        # `Deploy service` run.
        run: yarn build

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # NOTE-RT: the trust policy behind this ARN requires a `sub` of
          # `repo:randytarampi/me:environment:<stage>`, which this job satisfies only because it
          # declares `environment:` above. Remove that and the role stops being assumable.
          #
          # The account id is a literal for the same reason `service/serverless.yml` keeps one:
          # deriving it needs an STS call, and it is not a secret.
          role-to-assume: arn:aws:iam::471964952458:role/me-deploy-service-${{ inputs.deployment_environment }}
          role-session-name: deploy-service-${{ github.run_id }}
          # NOTE-RT: `service`'s `deploy:prd` targets `ca-central-1` and `deploy:dev` targets
          # `us-east-1` (see `service/package.json`). Both pass `--region` explicitly, so a
          # mismatch here was survivable rather than harmless — anything else the job asks AWS
          # for would have gone to the wrong region.
          aws-region: ${{ inputs.deployment_environment == 'prd' && 'ca-central-1' || 'us-east-1' }}

      - name: Prove which identity we're deploying as
        # NOTE-RT: cheap, and it is the assertion that the whole OIDC migration turns on — the ARN
        # here must read `…:assumed-role/me-deploy-service-<stage>/…`. Until that has been seen in
        # a real run, the 2022 access keys must not be deleted: there is no other credential left
        # to create a replacement with.
        run: aws sts get-caller-identity

      - name: Deploy service
        run: cd service && yarn run deploy
