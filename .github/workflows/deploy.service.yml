name: deploy (service)

on:
  workflow_call:
    inputs:
      deployment_environment:
        description: 'The deployment environment'
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      SERVERLESS_ACCESS_KEY:
        required: true

  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'The deployment environment'
        required: true
        default: prd
        type: choice
        options:
          - dev
          - prd

concurrency:
  group: deploy-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-service:
    environment: ${{ inputs.deployment_environment }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NODE_ENV: ${{ inputs.deployment_environment }}
      # NOTE-RT: Serverless Framework v4 refuses to run unauthenticated, and the CLI's interactive
      # login prompt would hang a CI run. See https://www.serverless.com/framework/docs/guides/license-keys
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node@24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install

      - name: Configure AWS credentials from secrets
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy service
        run: cd service && yarn run deploy
