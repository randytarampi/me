name: CI

# Allowlist validation 2026-09-05: confirm the qlty-action permit shipped via pulumi.

on:
  push:
    # NOTE-RT: `main` only. Without this every branch with an open pull request runs the entire
    # suite *twice* — once for the `push` and once for the `pull_request` — on separate runners with
    # separate concurrency groups, so neither cancels the other. Three matrix legs became six for no
    # additional signal, and it made triaging the first real run considerably harder than it needed
    # to be. Branch pushes are still covered: the pull request is what gates the merge, and it is
    # also the ref the `main` ruleset's required status check is read from.
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/install.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/deploy.pages.yml'
      - '.github/workflows/deploy.infrastructure.yml'
      - '.github/workflows/release.yml'
      - 'infrastructure/**'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/install.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/deploy.pages.yml'
      - '.github/workflows/deploy.infrastructure.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    uses: ./.github/workflows/install.yml

  test:
    needs:
      - install
    uses: ./.github/workflows/test.yml
    secrets:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  # NOTE-RT: inline per owner's direction - runs in parallel with the callee's Coveralls finalize,
  # gated on the same `test` job, and downloads the per-leg coverage artifacts test.yml uploaded.
  # The qlty action requires `id-token: write` for its OIDC exchange; the allowlist entry lives in
  # the Pulumi-managed Actions policy (`infrastructure/src/github/repository.ts`).
  qlty:
    name: Publish coverage to Qlty
    needs:
      - test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download per-leg coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage
      - name: Merge coverage reports
        run: |
          : > coverage/lcov.info
          for file in coverage/coverage-node-*/lcov.info; do
            [ -f "$file" ] || continue
            cat "$file" >> coverage/lcov.info
          done
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

  deploy__infrastructure--dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - install
      - test
    uses: ./.github/workflows/deploy.infrastructure.yml
    with:
      stack: dev

  deploy__www--dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - install
      - test
      - deploy__infrastructure--dev
    uses: ./.github/workflows/deploy.pages.yml
    with:
      application_name: www
      deployment_environment: dev
      deployment_ref: ${{ github.sha }}
    secrets:
      GH_PAGES_DEPLOYMENT_TOKEN: ${{ secrets.GH_PAGES_DEPLOYMENT_TOKEN }}
    permissions:
      contents: write
      deployments: write

  deploy__service--dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - install
      - test
      - deploy__infrastructure--dev
    uses: ./.github/workflows/deploy.service.yml
    with:
      deployment_environment: dev
