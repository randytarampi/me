name: infrastructure

# NOTE-RT: on pull requests, only `pulumi preview` runs — the deploy job is skipped via
# `if: github.event_name != 'pull_request'` in `deploy.infrastructure.yml`. This keeps PRs
# read-only: drift shows up in review, but nothing is applied. `pulumi up` is a deliberate act
# run by a human who has read the diff, because this program owns the credentials every other
# workflow depends on. A bad apply here doesn't break a deploy, it removes the ability to deploy.
on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure.yml'
      - '.github/workflows/deploy.infrastructure.yml'

  workflow_dispatch:

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-dev:
    uses: ./.github/workflows/deploy.infrastructure.yml
    with:
      stack: dev

  preview-prd:
    uses: ./.github/workflows/deploy.infrastructure.yml
    with:
      stack: prd
