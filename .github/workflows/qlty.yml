name: Qlty coverage

# NOTE-RT: gated on CI completing rather than declared inline in ci.yml. Two findings live behind
# this: (1) with a qlty job inline in ci.yml, *every* push startup-failed regardless of what the
# push touched, while the identical job shape runs green in the fleet's non-caller workflows — a
# caller of reusable workflows is strict about jobs requesting `id-token: write`, even at job
# level; (2) the same job inside the reusable test.yml startup-failed the same way. A standalone
# workflow_run workflow sidesteps both, mirroring how release.yml is gated on CI.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: qlty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    name: Publish coverage to Qlty
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download per-leg coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge coverage reports
        run: |
          : > coverage/lcov.info
          for file in coverage/coverage-node-*/lcov.info; do
            [ -f "$file" ] || continue
            cat "$file" >> coverage/lcov.info
          done
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info