name: test

on:
  workflow_call:
    inputs:
      deployment_environment:
        description: 'The targeted `DEPLOYMENT_ENVIRONMENT`'
        required: false
        default: dev
        type: string
    secrets:
      COVERALLS_REPO_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'The targeted `DEPLOYMENT_ENVIRONMENT`'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prd

jobs:
  test:
    name: Run affected test suite
    strategy:
      fail-fast: false
      matrix:
        # NOTE-RT: Node 20 reached end of life on 2026-04-30. 26 is Current, not yet LTS.
        node-version: [22, 24, 26]
    env:
      # NOTE-RT: deliberately fake, and previously the repository's real 2022-vintage production
      # keys. `service`'s suite talks to a local emulator, but the AWS SDK still refuses to sign a
      # request without *some* credential in the chain, which is the only reason they were ever
      # here. Handing a test job production credentials to satisfy a signature check is a bad
      # trade; `test`/`test` is the conventional pair for local AWS emulators.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DEPLOY: false
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.deployment_environment || inputs.deployment_environment }}
      # NOTE-RT: the daemon is a long-lived background process that holds the project graph in
      # memory for the whole run. Useful on a laptop across many invocations; on a runner that
      # invokes Nx twice it is pure resident memory competing with the builds.
      NX_DAEMON: false
    runs-on:
      - ubuntu-latest
    concurrency: test-${{ github.ref }}-${{ matrix.node-version }}
    # NOTE-RT: replaces `rrainn/dynamodb-action`, which declared `runs.using: node12`. `service`'s
    # `localstack:start` no-ops when something is already listening on 4566, so the same scripts
    # work here and on a laptop without branching on `CI`.
    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
        options: >-
          --health-cmd "curl --fail http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - name: Set variables
        id: variables
        run: |
          echo "deployment_environment=$DEPLOYMENT_ENVIRONMENT" >> "$GITHUB_OUTPUT"

          {
            echo "NODE_ENV=$DEPLOYMENT_ENVIRONMENT"
            echo "PRINTABLE_PUPPETEER_NO_SANDBOX=$CI"
            echo "CPU_ARCH=$RUNNER_ARCH"
            echo "OS_NAME=$RUNNER_OS"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo "GIT_BRANCH=$GITHUB_REF_NAME"
            echo "COMMIT_SHA=$GITHUB_SHA"
            echo "GIT_COMMIT_SHA=$GITHUB_SHA"
            echo "BUILD_NUMBER=$GITHUB_RUN_ID"
            echo "JOB_NUMBER=$GITHUB_RUN_ATTEMPT"

            if [[ "$GITHUB_EVENT_NAME" == 'pull_request' || "$GITHUB_EVENT_NAME" == 'pull_request_target' ]]; then
              echo "PULL_REQUEST=true"
            fi
          } >> "$GITHUB_ENV"

      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node@${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Setup dependencies on build runner
        run: |
          sudo apt-get update
          sudo apt-get install language-pack-ja japan* fonts-wqy-microhei ttf-wqy-microhei

      # @NOTE-RT: Rerun `install` to make sure we've got our dependencies
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Actually run `yarn install`
        run: yarn install

      # NOTE-RT: this exists because of what the first-ever run of this job did. All six matrix legs
      # across two runs died the same way: partway through the workspace builds, immediately after
      # `@randy.tarampi/serverless:build`, with `gulp build` processes still alive at cleanup and
      # `##[error]The operation was canceled.` as the only message. One leg's step recorded no
      # `conclusion` and no `completed_at` at all, which is what it looks like when the runner
      # itself goes away rather than a step failing. Nothing had reached a single test.
      #
      # These two figures are the cheapest way to tell memory exhaustion from disk exhaustion on the
      # next run, and the runner image ships ~30GB of toolchains this repository never touches.
      - name: Reclaim runner disk and report resources
        run: |
          echo "::group::Before"
          df -h /
          free -h
          echo "::endgroup::"

          # NOTE-RT: deliberately *not* `$AGENT_TOOLSDIRECTORY`, which the widely-copied version of
          # this snippet includes. `actions/setup-node` installs into it, and it is on `PATH` for
          # the rest of the job — deleting it here removes the Node this job is running on.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

          echo "::group::After"
          df -h /
          free -h
          echo "::endgroup::"

      - name: Actually run affected tests
        id: test-actual
        env:
          NODE_ENV: test
        run: |
          if [ "$(yarn lerna ls --since HEAD...origin/master --json 2>/dev/null)" = "[]" ]; then
            yarn run pretest
            yarn cover:actual
          else
            yarn lerna run pretest --since HEAD...origin/master --concurrency 1
            yarn lerna run cover --since HEAD...origin/master --concurrency 1
          fi
        # NOTE-RT: on a `master` push `lerna ls --since` is empty, so this takes the *full* branch:
        # build every workspace, render the Puppeteer PDFs, and run the service suite against the
        # LocalStack container above. 10 minutes was never enough for that. This figure is a ceiling
        # meant to catch a hang, not a measurement — tighten it once a few real runs are observed.
        #
        # NOTE-RT: `--concurrency 1`, and `2>/dev/null` on the `lerna ls` so the `[]` comparison sees
        # stdout rather than stdout interleaved with lerna's notices. Nx defaults to three tasks in
        # parallel, which puts `resume`, `service` and `www` — including a full webpack client
        # bundle — on the runner at the same moment. That is exactly where every leg of the first
        # real run died. Serial is slower and it is the only version anyone has seen finish; raise it
        # again once the resource figures printed above show headroom.
        timeout-minutes: 45
      - name: Cleanup after tests
        if: always()
        env:
          NODE_ENV: test
        run: |
          yarn run kill --scope @randy.tarampi/service
      - name: Collect results
        if: always()
        env:
          NODE_ENV: test
        run: |
          yarn run pretest:collect
          yarn run cover:collect
      - name: Report coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          flag-name: node-${{ matrix.node-version }}
          parallel: true

  coveralls:
    name: Finalize the Coveralls report
    needs:
      - test
    if: always()
    runs-on:
      - ubuntu-latest
    steps:
      - name: Tell Coveralls every matrix leg has reported
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
