name: test

on:
  workflow_call:
    inputs:
      deployment_environment:
        description: 'The targeted `DEPLOYMENT_ENVIRONMENT`'
        required: false
        default: dev
        type: string
    secrets:
      COVERALLS_REPO_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'The targeted `DEPLOYMENT_ENVIRONMENT`'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prd

jobs:
  test:
    name: Run affected test suite
    strategy:
      fail-fast: false
      matrix:
        # NOTE-RT: Node 20 reached end of life on 2026-04-30. 26 is Current, not yet LTS.
        node-version: [22, 24, 26]
    env:
      # NOTE-RT: deliberately fake, and previously the repository's real 2022-vintage production
      # keys. `service`'s suite talks to a local emulator, but the AWS SDK still refuses to sign a
      # request without *some* credential in the chain, which is the only reason they were ever
      # here. Handing a test job production credentials to satisfy a signature check is a bad
      # trade; `test`/`test` is the conventional pair for local AWS emulators.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DEPLOY: false
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.deployment_environment || inputs.deployment_environment }}
      # NOTE-RT: the daemon is a long-lived background process that holds the project graph in
      # memory for the whole run. Useful on a laptop across many invocations; on a runner that
      # invokes Nx twice it is pure resident memory competing with the builds.
      NX_DAEMON: false
    runs-on:
      - ubuntu-latest
    concurrency: test-${{ github.ref }}-${{ matrix.node-version }}
    # NOTE-RT: replaces `rrainn/dynamodb-action`, which declared `runs.using: node12`. `service`'s
    # `localstack:start` no-ops when something is already listening on 4566, so the same scripts
    # work here and on a laptop without branching on `CI`.
    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
        options: >-
          --health-cmd "curl --fail http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - name: Set variables
        id: variables
        run: |
          echo "deployment_environment=$DEPLOYMENT_ENVIRONMENT" >> "$GITHUB_OUTPUT"

          {
            echo "NODE_ENV=$DEPLOYMENT_ENVIRONMENT"
            echo "PRINTABLE_PUPPETEER_NO_SANDBOX=$CI"
            echo "CPU_ARCH=$RUNNER_ARCH"
            echo "OS_NAME=$RUNNER_OS"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo "GIT_BRANCH=$GITHUB_REF_NAME"
            echo "COMMIT_SHA=$GITHUB_SHA"
            echo "GIT_COMMIT_SHA=$GITHUB_SHA"
            echo "BUILD_NUMBER=$GITHUB_RUN_ID"
            echo "JOB_NUMBER=$GITHUB_RUN_ATTEMPT"

            if [[ "$GITHUB_EVENT_NAME" == 'pull_request' || "$GITHUB_EVENT_NAME" == 'pull_request_target' ]]; then
              echo "PULL_REQUEST=true"
            fi
          } >> "$GITHUB_ENV"

      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node@${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Setup dependencies on build runner
        run: |
          sudo apt-get update
          sudo apt-get install language-pack-ja japan* fonts-wqy-microhei ttf-wqy-microhei

      # @NOTE-RT: Rerun `install` to make sure we've got our dependencies
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Actually run `yarn install`
        run: yarn install

      # NOTE-RT: this exists because of what the first-ever runs of this job did — every matrix leg
      # died with `##[error]The operation was canceled.` and nothing else, one of them recording no
      # `conclusion` and no `completed_at` at all, which is what it looks like when the runner goes
      # away rather than when a step fails.
      #
      # The two figures settled it: 78GB of disk free before the reclaim and 99GB after, so disk was
      # never the constraint, while `free -h` reports ~14GB against a `cover` invocation that was
      # running four webpack/Puppeteer/LocalStack tasks at once (see the step below). Keep printing
      # them — they are what turns "the runner vanished" into a number — and keep the reclaim, which
      # is cheap and removes ~30GB of toolchains this repository never touches.
      - name: Reclaim runner disk and report resources
        run: |
          echo "::group::Before"
          df -h /
          free -h
          echo "::endgroup::"

          # NOTE-RT: deliberately *not* `$AGENT_TOOLSDIRECTORY`, which the widely-copied version of
          # this snippet includes. `actions/setup-node` installs into it, and it is on `PATH` for
          # the rest of the job — deleting it here removes the Node this job is running on.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

          echo "::group::After"
          df -h /
          free -h
          echo "::endgroup::"

      - name: Actually run affected tests
        id: test-actual
        env:
          NODE_ENV: test
        run: |
          since=(--since HEAD...origin/master)

          if [ "$(yarn lerna ls --since HEAD...origin/master --json 2>/dev/null)" = "[]" ]; then
            since=()
          fi

          rm -rf .nyc_output/ coverage/

          yarn lerna run pretest "${since[@]}" --concurrency 1 --stream
          yarn lerna run cover "${since[@]}" --concurrency 1 --stream
        # NOTE-RT: one code path, differing only in whether `--since` is passed. The empty-`[]`
        # branch used to call the root `pretest` and `cover:actual` scripts instead, and between
        # them they accounted for everything that made the first four runs of this job unreadable:
        #
        #   - `pretest` is `pretest:actual; pretest:collect`. The `;` means a lint failure is
        #     swallowed and the script exits with the *collector's* status, so nine workspaces could
        #     fail to lint and the step would carry on as though nothing had happened.
        #   - `cover:actual` runs `--no-bail --concurrency $(nproc)` with no `--stream`. Four
        #     coverage tasks at once — webpack bundles, Puppeteer renders and the LocalStack suite
        #     among them — buffered, on a runner with ~14GB of memory. `cover` is also the target
        #     that `dependsOn` `build`, which is why the workspace builds appeared *after* the lint
        #     failures, and why the silence that followed could never be pinned to a task.
        #
        # Nothing is lost by not calling them: `Collect results` below runs both collectors under
        # `if: always()`, and the `rm -rf` above is the one other thing `cover:actual` did.
        #
        # NOTE-RT: `2>/dev/null` on the `lerna ls` so the `[]` comparison sees stdout rather than
        # stdout interleaved with lerna's notices. On a `master` push it is empty, so this takes the
        # *full* branch: build every workspace, render the Puppeteer PDFs, and run the service suite
        # against the LocalStack container above. 10 minutes was never enough for that; 45 is a
        # ceiling meant to catch a hang, not a measurement — tighten it once a few real runs are
        # observed.
        #
        # NOTE-RT: `--stream` is not cosmetic, it is the diagnostic. Nx's default output style
        # buffers each task's output and prints it as a group *when the task finishes*, so a task
        # that never finishes is never named.
        timeout-minutes: 45
      - name: Cleanup after tests
        if: always()
        env:
          NODE_ENV: test
        run: |
          yarn run kill --scope @randy.tarampi/service
      - name: Collect results
        if: always()
        env:
          NODE_ENV: test
        run: |
          yarn run pretest:collect
          yarn run cover:collect
      - name: Report coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          flag-name: node-${{ matrix.node-version }}
          parallel: true

  coveralls:
    name: Finalize the Coveralls report
    needs:
      - test
    if: always()
    runs-on:
      - ubuntu-latest
    steps:
      - name: Tell Coveralls every matrix leg has reported
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
