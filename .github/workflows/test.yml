name: test

on:
  workflow_call:
    inputs:
      deployment_environment:
        description: 'The targeted `DEPLOYMENT_ENVIRONMENT`'
        required: false
        default: dev
        type: string
    secrets:
      COVERALLS_REPO_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'The targeted `DEPLOYMENT_ENVIRONMENT`'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prd

jobs:
  test:
    name: Run affected test suite
    strategy:
      fail-fast: false
      matrix:
        # NOTE-RT: Node 20 reached end of life on 2026-04-30. 26 is Current, not yet LTS.
        node-version: [22, 24, 26]
    env:
      # NOTE-RT: deliberately fake, and previously the repository's real 2022-vintage production
      # keys. `service`'s suite talks to a local emulator, but the AWS SDK still refuses to sign a
      # request without *some* credential in the chain, which is the only reason they were ever
      # here. Handing a test job production credentials to satisfy a signature check is a bad
      # trade; `test`/`test` is the conventional pair for local AWS emulators.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DEPLOY: false
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.deployment_environment || inputs.deployment_environment }}
    runs-on:
      - ubuntu-latest
    concurrency: test-${{ github.ref }}-${{ matrix.node-version }}
    steps:
      - name: Set variables
        id: variables
        run: |
          echo "deployment_environment=$DEPLOYMENT_ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "NODE_ENV=$DEPLOYMENT_ENVIRONMENT" >> $GITHUB_ENV
          echo "PRINTABLE_PUPPETEER_NO_SANDBOX=$CI" >> $GITHUB_ENV
          echo "CPU_ARCH=$RUNNER_ARCH" >> $GITHUB_ENV
          echo "OS_NAME=$RUNNER_OS" >> $GITHUB_ENV
          echo "BRANCH=$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "GIT_BRANCH=$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "COMMIT_SHA=$GITHUB_SHA" >> $GITHUB_ENV
          echo "GIT_COMMIT_SHA=$GITHUB_SHA" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$GITHUB_RUN_ID" >> $GITHUB_ENV
          echo "JOB_NUMBER=$GITHUB_RUN_ATTEMPT" >> $GITHUB_ENV
          if [[ $GITHUB_EVENT_NAME == 'pull_request' || $GITHUB_EVENT_NAME == 'pull_request_target' ]]; then
            echo "PULL_REQUEST=true" >> $GITHUB_ENV
          fi;

      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup node@${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Setup dependencies on build runner
        run: |
          sudo apt-get update
          sudo apt-get install language-pack-ja japan* fonts-wqy-microhei ttf-wqy-microhei

      # @NOTE-RT: Rerun `install` to make sure we've got our dependencies
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Actually run `yarn install`
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install

      - name: Setup DynamoDB Local
        uses: rrainn/dynamodb-action@v4.0.0
      - name: Actually run affected tests
        id: test-actual
        env:
          NODE_ENV: test
        run: |
          if [ "$(yarn lerna ls --since HEAD...origin/master --json)" = "[]" ]; then
            yarn run pretest
            yarn cover:actual
          else
            yarn lerna run pretest --since HEAD...origin/master
            yarn lerna run cover --since HEAD...origin/master
          fi
        # NOTE-RT: on a `master` push `lerna ls --since` is empty, so this takes the *full* branch:
        # build every workspace, render the Puppeteer PDFs, and run the service suite against
        # DynamoDB Local. 10 minutes was never enough for that. This figure is a ceiling meant to
        # catch a hang, not a measurement — tighten it once a few real runs have been observed.
        timeout-minutes: 45
      - name: Cleanup after tests
        if: always()
        env:
          NODE_ENV: test
        run: |
          yarn run kill --scope @randy.tarampi/service
      - name: Collect results
        if: always()
        env:
          NODE_ENV: test
        run: |
          yarn run pretest:collect
          yarn run cover:collect
      - name: Report coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          flag-name: node-${{ matrix.node-version }}
          parallel: true

  coveralls:
    name: Finalize the Coveralls report
    needs:
      - test
    if: always()
    runs-on:
      - ubuntu-latest
    steps:
      - name: Tell Coveralls every matrix leg has reported
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
